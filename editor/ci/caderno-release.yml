# Optional: builds Caderno's installers (.deb + AppImage on Linux, .dmg on macOS)
# and attaches them to a draft GitHub release.
#
# To use it, copy this file to `.github/workflows/caderno-release.yml` at the
# repository root, then either push a tag like `caderno-v0.1.0` or run it by hand
# (Actions → Caderno release → Run workflow).

name: Caderno release

on:
  push:
    tags: ["caderno-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: "--bundles deb,appimage"
          - platform: macos-latest
            args: "--target universal-apple-darwin --bundles app,dmg"
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libssl-dev libxdo-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            editor/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: editor/src-tauri -> target

      # The preview imports the blogs' components and CSS from ../src, whose
      # types resolve from the site's node_modules. A fresh CI machine is not the
      # shared checkout, so installing at the root is fine here.
      - name: Install (site, for types)
        run: npm ci --ignore-scripts

      - name: Install (editor)
        run: npm ci
        working-directory: editor

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: editor
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('caderno-build-{0}', github.run_number) }}
          releaseName: "Caderno ${{ github.ref_type == 'tag' && github.ref_name || github.run_number }}"
          releaseBody: "Instaladores do Caderno, o editor de artigos do portfólio."
          releaseDraft: true
          args: ${{ matrix.args }}
